<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subcaster · Λογαριασμός</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg: #0f1713; --panel: #16211b; --line: #2a3a31; --text: #e8efe9; --muted: #9db3a5; --accent: #3ddc97; --danger: #ff6b6b; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #f4f1e8; --panel: #fffdf7; --line: #ddd6c4; --text: #1f2a24; --muted: #5d6b62; --accent: #1f9d68; --danger: #c53030; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { width: min(420px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; }
  .brand { font-weight: 800; letter-spacing: .02em; color: var(--accent); margin: 0 0 18px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0 0 16px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 4px; }
  input { width: 100%; height: 44px; padding: 0 12px; margin: 0 0 12px; border: 1px solid var(--line); border-radius: 9px; background: transparent; color: var(--text); font-size: 16px; }
  input:focus { outline: none; border-color: var(--accent); }
  button { width: 100%; height: 44px; border: 0; border-radius: 9px; background: var(--accent); color: #062417; font-weight: 700; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .msg { min-height: 1.4em; margin: 12px 0 0; font-size: 14px; }
  .msg.err { color: var(--danger); }
  .msg.ok { color: var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="card">
  <div class="brand">Subcaster</div>
  <section id="reset" hidden>
    <h1 data-el="Νέος κωδικός" data-en="New password">Νέος κωδικός</h1>
    <p data-el="Γράψε τον νέο κωδικό για τον λογαριασμό σου." data-en="Enter a new password for your account.">Γράψε τον νέο κωδικό για τον λογαριασμό σου.</p>
    <form id="form">
      <label for="p1" data-el="Νέος κωδικός (τουλάχιστον 6 χαρακτήρες)" data-en="New password (at least 6 characters)">Νέος κωδικός (τουλάχιστον 6 χαρακτήρες)</label>
      <input id="p1" type="password" autocomplete="new-password" minlength="6" required>
      <label for="p2" data-el="Ξανά τον ίδιο" data-en="Same again">Ξανά τον ίδιο</label>
      <input id="p2" type="password" autocomplete="new-password" minlength="6" required>
      <button id="go" data-el="Αποθήκευση κωδικού" data-en="Save password">Αποθήκευση κωδικού</button>
    </form>
  </section>
  <section id="done" hidden>
    <h1 data-el="Έτοιμο!" data-en="Done!">Έτοιμο!</h1>
    <p data-el="Ο κωδικός άλλαξε. Γύρνα στο Subcaster και συνδέσου με τον νέο κωδικό." data-en="Your password has changed. Go back to Subcaster and sign in with the new password.">Ο κωδικός άλλαξε. Γύρνα στο Subcaster και συνδέσου με τον νέο κωδικό.</p>
  </section>
  <section id="other" hidden>
    <h1 data-el="Μπορείς να κλείσεις αυτή τη σελίδα" data-en="You can close this page">Μπορείς να κλείσεις αυτή τη σελίδα</h1>
    <p data-el="Γύρνα στο Subcaster για να συνεχίσεις." data-en="Go back to Subcaster to continue.">Γύρνα στο Subcaster για να συνεχίσεις.</p>
  </section>
  <p id="msg" class="msg" role="alert"></p>
</main>
<script>
(function () {
  var SB = 'https://tkcwudpzpopltnavdnan.supabase.co';
  var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRrY3d1ZHB6cG9wbHRuYXZkbmFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1MTk0OTQsImV4cCI6MjExMDA5NTQ5NH0.InJDwTYNzhpr90Bu4dpycNgcjeb5XNsdqbemW1lET8w';
  var en = !/^el\b/i.test(navigator.language || '');
  if (en) {
    document.documentElement.lang = 'en';
    document.querySelectorAll('[data-en]').forEach(function (el) { el.textContent = el.getAttribute('data-en'); });
  }
  var T = function (el, enText) { return en ? enText : el; };
  var $ = function (id) { return document.getElementById(id); };
  var msg = function (t, cls) { $('msg').textContent = t || ''; $('msg').className = 'msg ' + (cls || ''); };
  var hash = new URLSearchParams(location.hash.slice(1));
  var query = new URLSearchParams(location.search);
  // the tokens stay out of the address bar (and out of the browser history)
  if (location.hash) history.replaceState(null, '', location.pathname);
  var token = hash.get('access_token');
  var type = hash.get('type') || query.get('type');
  var err = hash.get('error_description') || query.get('error_description');
  if (err) {
    $('other').hidden = false;
    msg(/expired|invalid/i.test(err) ? T('Ο σύνδεσμος έληξε ή χρησιμοποιήθηκε ήδη. Ζήτα νέο από το Subcaster («Ξέχασες τον κωδικό;»).', 'The link has expired or was already used. Ask for a new one in Subcaster ("Forgot your password?").') : err, 'err');
    return;
  }
  if (!token || type !== 'recovery') { $('other').hidden = false; return; }
  $('reset').hidden = false;
  $('p1').focus();
  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var a = $('p1').value, b = $('p2').value;
    if (a.length < 6) { msg(T('Ο κωδικός θέλει τουλάχιστον 6 χαρακτήρες.', 'The password needs at least 6 characters.'), 'err'); return; }
    if (a !== b) { msg(T('Οι δύο κωδικοί δεν είναι ίδιοι.', 'The two passwords are not the same.'), 'err'); return; }
    $('go').disabled = true; msg(T('Περίμενε…', 'Please wait…'));
    fetch(SB + '/auth/v1/user', { method: 'PUT', headers: { apikey: KEY, Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: JSON.stringify({ password: a }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (r) {
        if (r.ok) { $('reset').hidden = true; $('done').hidden = false; msg(''); token = null; return; }
        var m = String(r.j.msg || r.j.error_description || r.j.message || '');
        $('go').disabled = false;
        if (/different from the old/i.test(m)) msg(T('Ο νέος κωδικός πρέπει να είναι διαφορετικός από τον παλιό.', 'The new password must be different from the old one.'), 'err');
        else if (/expired|invalid|jwt/i.test(m)) msg(T('Ο σύνδεσμος έληξε. Ζήτα νέο από το Subcaster.', 'The link has expired. Ask for a new one in Subcaster.'), 'err');
        else msg(m || T('Κάτι πήγε στραβά. Δοκίμασε ξανά.', 'Something went wrong. Try again.'), 'err');
      })
      .catch(function () { $('go').disabled = false; msg(T('Δεν υπάρχει σύνδεση στο ίντερνετ.', 'No internet connection.'), 'err'); });
  });
})();
</script>
</body>
</html>
