name: test local translation model
on:
  workflow_dispatch:
  push:
    paths: ['tools/test_llm_mt.py', '.github/workflows/test-llm.yml']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install --quiet huggingface_hub gguf
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view b12195 --repo ggml-org/llama.cpp --json assets --jq '.assets[].name' | tee assets.txt
          gh release download b12195 --repo ggml-org/llama.cpp --pattern 'llama-b12195-bin-ubuntu-x64.tar.gz' -O llama.pkg
          mkdir llama && cd llama && (unzip -q ../llama.pkg || tar xzf ../llama.pkg) && find . -name 'llama-server' -exec chmod +x {} \;
      - run: python tools/test_llm_mt.py 42ailab/TranslateGemma-4B-GGUF 42ailab/TranslateGemma-12B-GGUF
      - env: { GH_TOKEN: '${{ github.token }}' }
        if: always()
        run: |
          gh release view tests >/dev/null 2>&1 || gh release create tests --title "tests" --notes "Δοκιμές" --prerelease
          touch results.txt; cat assets.txt >> results.txt || true
          gh release upload tests results.txt --clobber
