name: test homophones
on:
  workflow_dispatch:
  push:
    paths: ['tools/test_llm_hom.py', '.github/workflows/test-hom.yml']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install --quiet huggingface_hub
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release download b12195 --repo ggml-org/llama.cpp --pattern 'llama-b12195-bin-ubuntu-x64.tar.gz' -O llama.pkg
          mkdir llama && cd llama && tar xzf ../llama.pkg && find . -name 'llama-server' -exec chmod +x {} \;
      - run: python tools/test_llm_hom.py ggml-org/gemma-3-4b-it-GGUF "Οι παρακάτω γραμμές είναι ελληνικοί υπότιτλοι από αυτόματη αναγνώριση φωνής. Κάποιες λέξεις μπορεί να είναι γραμμένες ως άλλη λέξη που ακούγεται ίδια (π.χ. σχόλιο/σχολείο, τύχη/τείχη, λύπη/λίπη, κλείνω/κλίνω, πότε/ποτέ, ή λάθος κατάληξη όπως -ει/-η/-οι). Με βάση το νόημα της πρότασης, διόρθωσε ΜΟΝΟ τέτοια λάθη ορθογραφίας. Μην αλλάξεις, μην προσθέσεις, μην αφαιρέσεις και μην αλλάξεις σειρά σε καμία άλλη λέξη ή σημείο στίξης. Επίστρεψε ακριβώς τις ίδιες αριθμημένες γραμμές, μία ανά σειρά, χωρίς σχόλια."
      - env: { GH_TOKEN: '${{ github.token }}' }
        if: always()
        run: |
          touch hom.txt
          gh release upload tests hom.txt --clobber
